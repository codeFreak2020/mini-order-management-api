services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      # Keep the image's vendor (built for Linux) instead of the host's.
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: order_api
      DB_USERNAME: order_api
      DB_PASSWORD: secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - order-api

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_api_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: order_api
      DB_USERNAME: order_api
      DB_PASSWORD: secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: log
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - order-api

  nginx:
    image: nginx:alpine
    container_name: order_api_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - order-api

  mysql:
    image: mysql:8.0
    container_name: order_api_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: order_api
      MYSQL_USER: order_api
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - order-api

  redis:
    image: redis:7-alpine
    container_name: order_api_redis
    restart: unless-stopped
    ports:
      - "63791:6379"
    networks:
      - order-api

networks:
  order-api:
    driver: bridge

volumes:
  mysql_data:
